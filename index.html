<!DOCTYPE html>
<html>

<head>
  <title>Mappedin JS v6 Getting Started</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8" />
  <style>
    :root {
      --greenfield-forest: #123c2d;
      --greenfield-leaf: #3f9b68;
      --greenfield-mint: #dff3e6;
      --greenfield-ink: #183027;
      --greenfield-border: #c8ddd0;
      --greenfield-surface: #f6faf7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: 10vh 70vh 10vh;
      padding-top: 10vh;
      background: var(--greenfield-surface);
      color: var(--greenfield-ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1030;
      width: 100%;
      height: 10vh;
      min-height: 54px;
      box-shadow: 0 2px 12px rgb(18 60 45 / 18%);
    }

    .navbar>.container-fluid {
      height: 100%;
    }

    #app-chrome {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 72px);
      background: var(--greenfield-forest);
      color: white;
      box-shadow: 0 2px 12px rgb(18 60 45 / 18%);
    }

    #brand-mark {
      position: relative;
      width: 34px;
      height: 34px;
      border: 2px solid #b8e6c8;
      border-radius: 50% 50% 50% 10%;
      transform: rotate(-45deg);
    }

    #brand-mark::after {
      position: absolute;
      top: 7px;
      left: 14px;
      width: 2px;
      height: 19px;
      background: #b8e6c8;
      content: "";
      transform: rotate(45deg);
    }

    #brand-name {
      font-size: clamp(16px, 2vw, 26px);
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    #control-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px;
      background: var(--greenfield-mint);
      border-bottom: 1px solid var(--greenfield-border);
    }

    #control-bar button {
      min-width: 150px;
      padding: 11px 18px;
      border: 1px solid var(--greenfield-leaf);
      border-radius: 8px;
      background: white;
      color: var(--greenfield-forest);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    #control-bar button:hover:not(:disabled) {
      background: var(--greenfield-forest);
      color: white;
    }

    #control-bar button:disabled {
      border-color: #b8c8be;
      background: #e1e8e3;
      color: #78867e;
      cursor: not-allowed;
    }

    #map-section {
      min-height: 0;
      background: #eef3ef;
    }

    #mappedin-map {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #reserved-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid var(--greenfield-border);
      background: white;
      color: #789084;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .navbar-collapse {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        z-index: 1031;
        padding: 0.5rem 1rem;
        background: var(--greenfield-forest);
        box-shadow: 0 5px 12px rgb(18 60 45 / 22%);
      }

      .navbar-collapse .nav-link {
        border-bottom: 1px solid rgb(255 255 255 / 14%);
      }

      .navbar-collapse .nav-item:last-child .nav-link {
        border-bottom: 0;
      }

      #control-bar {
        gap: 8px;
        padding: 8px;
      }

      #control-bar button {
        min-width: 0;
        padding: 8px 10px;
      }
    }

    @media (max-width: 460px) {
      #control-bar button {
        padding: 7px 8px;
      }
    }

    #turn-by-turn-panel {
      color: var(--greenfield-ink);
    }
  </style>
</head>

<body>
  <header class="navbar navbar-expand-md navbar-dark fixed-top" style="background: var(--greenfield-forest);">
    <div class="container-fluid position-relative px-3 px-md-5">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#app-nav"
        aria-controls="app-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand position-absolute top-50 start-50 translate-middle d-flex align-items-center gap-2"
        href="#map" aria-label="Greenfield Mall Group">
        <span id="brand-mark" aria-hidden="true"></span>
        <span id="brand-name">Greenfield Mall Group</span>
      </a>
      <nav id="app-nav" class="collapse navbar-collapse" aria-label="Primary navigation">
        <ul class="navbar-nav gap-md-2">
          <li class="nav-item"><a class="nav-link" href="#map">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="#sales">Sales</a></li>
          <li class="nav-item"><a class="nav-link" href="#menus">Food Court Menus</a></li>
          <li class="nav-item"><a class="nav-link" href="#events">Events</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section id="control-bar" aria-label="Map controls">
    <button id="mode-button">
      Start Navigate Mode</button>
    <button id="start-walking-button" hidden disabled>
      Start Walking</button>
  </section>

  <main id="map-section">
    <div id="mappedin-map"></div>
  </main>

  <footer id="reserved-footer" aria-label="Reserved application space">
    Reserved application space
  </footer>

  <div id="turn-by-turn-panel" hidden
    style="position:fixed; z-index:69421; inset:0; background:white; padding:24px; overflow:auto; height:150px;">
    <div id="turn-by-turn-content"></div>
    <button id="turn-by-turn-ok">OK</button>
  </div>
  <script type="module" src="src/main.ts"></script>
</body>

</html>
