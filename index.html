<!DOCTYPE html>
<html>

<head>
  <title>Mappedin JS v6 Getting Started</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    #mappedin-map {
      height: 100%;
      width: 100%;
      position: relative;
    }
  </style>
</head>

<body>
  <div id="mappedin-map"></div>
  <button id="mode-button" style="position:fixed; z-index:69420; top:1px; left:0px;">
    Start Navigate Mode</button>
  <button id="start-walking-button" hidden disabled style="position:fixed; z-index:69420; top:32px; left:0px;">
    Start Walking</button>
  <div id="turn-by-turn-panel" hidden
    style="position:fixed; z-index:69421; inset:0; background:white; padding:24px; overflow:auto; height:150px;">
    <div id="turn-by-turn-content"></div>
    <button id="turn-by-turn-ok">OK</button>
  </div>
  <script type="module" src="src/main.ts"></script>
</body>

</html>
